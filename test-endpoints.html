<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>API Endpoint Tester</title>
    <style>
        body {
            font-family: sans-serif;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            padding: 20px;
        }
        .endpoint-card {
            border: 1px solid #ccc;
            border-radius: 5px;
            padding: 15px;
        }
        #response-viewer {
            grid-column: 2 / 3;
            grid-row: 1 / 4;
            border: 1px solid #ccc;
            border-radius: 5px;
            padding: 15px;
            white-space: pre-wrap;
            word-wrap: break-word;
        }
    </style>
</head>
<body>
    <div class="endpoint-card">
        <h2>Match Recipes</h2>
        <form id="match-recipes-form">
            <label for="user-id">User ID:</label>
            <input type="text" id="user-id" name="user-id" required>
            <br><br>
            <label for="k">k:</label>
            <input type="number" id="k" name="k" value="5">
            <br><br>
            <button type="submit">Match</button>
        </form>
    </div>

    <div id="response-viewer">
        <h2>Response</h2>
        <pre id="response-pre"></pre>
    </div>

    <script>
        const API_BASE_URL = 'https://pantryai.dragonchetan.com';

        const matchRecipesForm = document.getElementById('match-recipes-form');
        const responsePre = document.getElementById('response-pre');

        matchRecipesForm.addEventListener('submit', async (e) => {
            e.preventDefault();

            const userId = document.getElementById('user-id').value;
            const k = document.getElementById('k').value;

            const response = await fetch(`${API_BASE_URL}/recipes/match?user_id=${userId}&k=${k}`);
            const data = await response.json();

            responsePre.textContent = JSON.stringify(data, null, 2);
        });
    </script>
</body>
</html>
