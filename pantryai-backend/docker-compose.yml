services:
  api:
    build: .
    ports:
      - "5001:5001"
    environment:
      FLASK_DEBUG: "${FLASK_DEBUG}"
      GOOGLE_API_KEY: "${GOOGLE_API_KEY}"
      DATABASE_PATH: /data/pantryai.sqlite3
      # no FAISS_INDEX_PATH here—let Config.py fall back to "recipes.index"
    volumes:
      - .:/app
      - ./data:/data
